noise:
  kind: noise
  family: natural_distortions
  param: snr_db
  severity_sign: -1.0
  levels: [30, 20, 15, 10, 5, 0]
  options:
    color: pink

chirp:
  kind: noise
  family: natural_distortions
  param: snr_db
  severity_sign: -1.0
  levels: [25, 20, 15, 10, 5]
  options:
    color: chirp

real_noise:
  kind: noise
  family: natural_distortions_real
  param: snr_db
  severity_sign: -1.0
  levels: [30, 20, 15, 10, 5, 0]
  options:
    color: file
    corpus: data/corpora/musan_noise

real_bird:
  kind: noise
  family: natural_distortions_real
  param: snr_db
  severity_sign: -1.0
  levels: [25, 20, 15, 10, 5]
  options:
    color: file
    corpus: data/corpora/esc50_birds

reverb:
  kind: reverb
  family: natural_distortions
  param: rt60_s
  severity_sign: 1.0
  levels: [0.1, 0.3, 0.5, 0.7, 0.9]
  options: {}

real_rir:
