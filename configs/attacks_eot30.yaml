pgd_eot:
  attack: pgd_eot
  family: adversarial_attacks
  param: snr_db
  levels: [40, 30]
  options:
    budget: snr
    steps: 10
    alpha_ratio: 0.25
    eot_samples: 30
    noise_snr_db: 20.0

pgd:
  attack: pgd
  family: adversarial_attacks
  param: snr_db
  levels: [40, 30]
  options:
    budget: snr
    steps: 10
    alpha_ratio: 0.25
