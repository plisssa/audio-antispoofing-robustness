transfer_nes2net:
  attack: surrogate_transfer
  family: adversarial_attacks
  param: snr_db
  levels: [50, 45]
  options:
    budget: snr
    surrogate: nes2net
    surrogate_steps: 100
    surrogate_restarts: 3
    alpha_ratio: 0.025

warm_from_nes2net:
  attack: pgd_warm
  family: adversarial_attacks
  param: snr_db
  levels: [50, 45]
  options:
    budget: snr
    surrogate: nes2net
    surrogate_steps: 100
    surrogate_restarts: 3
    steps: 100
    alpha_ratio: 0.025
