noise:
  kind: noise
  family: natural_distortions
  param: snr_db
  severity_sign: -1.0
  levels: [30, 20, 15, 10, 5, 0]
  options:
    color: pink

chirp:
  kind: noise
  family: natural_distortions
  param: snr_db
  severity_sign: -1.0
  levels: [25, 20, 15, 10, 5]
  options:
    color: chirp

codec:
  kind: codec
  family: codec_compression
  param: bitrate_kbps
  severity_sign: -1.0
  levels: [128, 64, 32, 24, 16, 8]
  options:
    codec: mp3

transcode_identity:
  kind: codec
  family: codec_compression
  param: bitrate_kbps
  severity_sign: -1.0
  levels: [320, 256, 192]
  options:
    codec: mp3

transmission:
  kind: transmission
  family: transmission_effects
  param: packet_loss_rate
  severity_sign: 1.0
  levels: [0.0, 0.01, 0.05, 0.1, 0.2]
  options:
    packet_ms: 20
    conceal: hold

reverb:
  kind: reverb
  family: natural_distortions
  param: rt60_s
  severity_sign: 1.0
  levels: [0.1, 0.3, 0.5, 0.7, 0.9]
  options: {}

gain:
  kind: gain
  family: natural_distortions
  param: gain_db
  severity_sign: 1.0
  levels: [-20, -10, -3, 3, 10, 20]
  options: {}

bandpass:
  kind: bandpass
  family: synthetic_perturbations
  param: high_hz
  severity_sign: -1.0
  levels: [8000, 6000, 4000, 3400, 2000]
  options:
    low_hz: 100
