[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adfd-robustness"
version = "0.1.0"
description = "Robustness evaluation framework for audio deepfake detectors"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "scikit-learn",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
gpu = ["torch", "torchaudio", "transformers", "huggingface-hub"]

[project.scripts]
adfd = "adfd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
